name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  core-tests:
    name: Core tests · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install pytest==9.1.1
      - name: Run credential-free core suite
        run: python -m pytest -q --ignore=tests/test_isolated_preview.py
      - name: Compile Python sources
        run: python -m compileall -q clickup_work_router dashboard __init__.py

  javascript-contracts:
    name: JavaScript contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Check web-dashboard entrypoint
        run: node --check dashboard/dist/index.js
      - name: Check native Desktop entrypoint
        run: node --check desktop-plugin/plugin.js

  native-isolated-lifecycle:
    name: Native isolated lifecycle · Hermes 0.19.0
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install pinned Hermes and test dependency
        run: python -m pip install hermes-agent==0.19.0 pytest==9.1.1
      - name: Configure repository-local snapshot identity
        run: |
          git config user.name "ClickUp Router CI"
          git config user.email "clickup-router-ci@localhost"
      - name: Exercise native installer and disposable preview
        run: python -m pytest -q tests/test_isolated_preview.py
